name: Build & Release Git UPS

on:
  push:
    branches: [main]
    tags: ["v*", "git-ups/*"]
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write
  attestations: write

jobs:
  build-client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mismas plataformas que publica git-lfs.
        include:
          - { os: darwin, arch: amd64 }
          - { os: darwin, arch: arm64 }
          - { os: freebsd, arch: 386 }
          - { os: freebsd, arch: amd64 }
          - { os: linux, arch: 386 }
          - { os: linux, arch: amd64 }
          - { os: linux, arch: arm }
          - { os: linux, arch: arm64 }
          - { os: linux, arch: loong64 }
          - { os: linux, arch: ppc64le }
          - { os: linux, arch: riscv64 }
          - { os: linux, arch: s390x }
          - { os: windows, arch: 386 }
          - { os: windows, arch: amd64 }
          - { os: windows, arch: arm64 }

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417
        with:
          go-version-file: go.mod

      - name: Get commit info
        id: info
        run: |
          short=$(git rev-parse --short HEAD)
          echo "short=$short" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ver=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ver=$short" >> "$GITHUB_OUTPUT"
          fi

      - name: Build git-ups (${{ matrix.os }}/${{ matrix.arch }})
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          BIN="git-ups-${{ matrix.os }}-${{ matrix.arch }}$EXT"
          go build \
            -trimpath \
            -ldflags="-s -w \
              -X 'github.com/livrasand/git-ups/internal/cli.version=${{ steps.info.outputs.ver }}'" \
            -o "$BIN" \
            ./cmd
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: SHA-256 del binario
        id: sha
        run: |
          BIN="${{ steps.build.outputs.bin }}"
          HASH=$(sha256sum "$BIN" | awk '{print $1}')
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "### git-ups SHA-256 (${{ matrix.os }}/${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$BIN  $HASH" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance (Sigstore)
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32
        with:
          subject-path: ${{ steps.build.outputs.bin }}

      - name: Publicar SHA-256 como artefacto
        run: |
          BIN="${{ steps.build.outputs.bin }}"
          echo "${{ steps.sha.outputs.hash }}  $BIN" > "$BIN.sha256"
          echo "commit: ${{ steps.info.outputs.short }}" >> "$BIN.sha256"
          echo "built:  ${{ steps.info.outputs.built }}" >> "$BIN.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: git-ups-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            ${{ steps.build.outputs.bin }}
            ${{ steps.build.outputs.bin }}.sha256
          retention-days: 90

  # Un solo job publica el release: primero crea un borrador con todos los
  # binarios y solo después lo publica. Así no se intenta subir assets a un
  # release ya publicado (los releases son inmutables).
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-client
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3
        with:
          pattern: git-ups-*
          path: release
          merge-multiple: true

      - name: Generate SHA256SUMS
        working-directory: release
        run: |
          for f in git-ups-*; do
            case "$f" in *.sha256) continue ;; esac
            sha256sum "$f"
          done > SHA256SUMS
          cat SHA256SUMS

      - name: Create draft release with all assets
        uses: softprops/action-gh-release@153bb8e04406b158c6c84fc1615b65b24149a1fe
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/git-ups-*
            release/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
